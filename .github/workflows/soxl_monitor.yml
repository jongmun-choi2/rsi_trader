name: SOXL Strategy B 15m Monitor

on:
  # 15분마다 자동 실행 (미국 주식 시장 감시)
  schedule:
    - cron: '*/15 * * * *'
  # GitHub 웹 화면에서 수동으로 'Run workflow' 버튼을 눌러 즉시 테스트 가능
  workflow_dispatch:

jobs:
  check-soxl:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run SOXL 15m Strategy Check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TOSS_CLIENT_ID: ${{ secrets.TOSS_CLIENT_ID }}
          TOSS_CLIENT_SECRET: ${{ secrets.TOSS_CLIENT_SECRET }}
        run: |
          PYTHONPATH=. python -c "from rsi_trader.monitor_soxl import SoxlStrategyBMonitor; m = SoxlStrategyBMonitor(); m.check_once(send_heartbeat=True)"
